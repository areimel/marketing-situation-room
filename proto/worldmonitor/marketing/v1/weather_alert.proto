syntax = "proto3";

package worldmonitor.marketing.v1;

import "sebuf/http/annotations.proto";

// WeatherAlert is one active NWS alert that touches a client service area.
message WeatherAlert {
  // Upstream NWS alert identifier.
  string id = 1;
  // NWS event name, such as "Winter Storm Warning".
  string event = 2;
  // Mapped severity bucket: info, watch or warning.
  string severity = 3;
  // Short NWS headline for the alert.
  string headline = 4;
  // Human-readable area description from NWS.
  string area_desc = 5;
  // Alert onset time, Unix epoch milliseconds.
  int64 onset = 6 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Alert expiry time, Unix epoch milliseconds.
  int64 expires = 7 [(sebuf.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // Alert shape as a GeoJSON geometry string; empty when no shape is known.
  string polygon_geojson = 8;
  // NWS zone codes the alert covers.
  repeated string zone_codes = 9;
  // Two-letter US state codes the alert covers.
  repeated string state_codes = 10;
}
