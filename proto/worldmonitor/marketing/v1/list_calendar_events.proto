syntax = "proto3";

package worldmonitor.marketing.v1;

import "buf/validate/validate.proto";
import "sebuf/http/annotations.proto";
import "worldmonitor/marketing/v1/calendar_event.proto";

// ListCalendarEventsRequest selects a date window and marketing categories.
message ListCalendarEventsRequest {
  // First date of the window, inclusive, as YYYY-MM-DD.
  string from_date = 1 [
    (sebuf.http.query) = {name: "from_date"},
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"
  ];
  // Last date of the window, inclusive, as YYYY-MM-DD.
  string to_date = 2 [
    (sebuf.http.query) = {name: "to_date"},
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^\\d{4}-\\d{2}-\\d{2}$"
  ];
  // Marketing category ids to include; an empty list means all categories.
  repeated string categories = 3 [
    (sebuf.http.query) = {name: "categories"},
    (buf.validate.field).repeated.max_items = 15
  ];
}

// ListCalendarEventsResponse carries the events inside the requested window.
message ListCalendarEventsResponse {
  // Events in the requested window and categories.
  repeated CalendarEvent events = 1;
  // True when an upstream source failed and the list may be incomplete.
  bool degraded = 2;
}
