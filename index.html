<!DOCTYPE html>
<html lang="en" data-variant="marketing">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Marketing Situation Room</title>
    <meta name="application-name" content="Marketing Situation Room" />
    <meta name="description" content="Track local mentions, demand signals, weather alerts and upcoming events across client markets." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#101d24" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Marketing Situation Room" />
    <meta property="og:description" content="Agency intelligence for client markets." />
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favico/marketing/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favico/marketing/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favico/marketing/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favico/marketing/apple-touch-icon.png" />


    <style>
      body { margin: 0; }
      .workspace-loading, noscript p {
        margin: 0;
        padding: 2rem;
        background: #101d24;
        color: #edf4f4;
        font: 1rem/1.5 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript><p>Enable JavaScript to open Marketing Situation Room.</p></noscript>
    <div id="app">
      <p class="workspace-loading" role="status">Loading Marketing Situation Room…</p>
    </div>
    <!-- Force-clear stale service worker if module scripts 404 (post-deploy cache mismatch) -->
    <script>
    (function(){
      if(!('serviceWorker' in navigator))return;
      var key='wm-sw-nuke';
      var attempted=false;
      try{if(sessionStorage.getItem(key))return}catch(e){}
      window.addEventListener('error',function(e){
        var t=e.target;var u=t&&(t.tagName==="SCRIPT"||t.tagName==="LINK")&&(t.src||t.href)||'';
        if(u&&/\/assets\//.test(u)){
          try{sessionStorage.setItem(key,'1')}catch(err){if(attempted)return;attempted=true}
          navigator.serviceWorker.getRegistrations().then(function(regs){
            var p=regs.map(function(r){return r.unregister()});
            Promise.all(p).then(function(){
              if(caches&&caches.keys){
                caches.keys().then(function(ks){
                  return Promise.all(ks.map(function(k){return caches.delete(k)}));
                }).then(function(){location.reload()});
              }else{location.reload()}
            });
          });
        }
      },true);
    })()
    </script>
    <script type="module" src="/src/main.ts" nonce="wm-static-bootstrap"></script>
  </body>
</html>
