openapi: 3.1.0
info:
    title: MarketingService API
    version: 1.0.0
security:
    - WorldMonitorKey: []
    - ApiKeyHeader: []
servers:
    - url: https://api.worldmonitor.app
paths:
    /api/marketing/v1/list-weather-alerts:
        get:
            tags:
                - MarketingService
            summary: ListWeatherAlerts
            description: ListWeatherAlerts returns active NWS alerts for the requested US states.
            operationId: ListWeatherAlerts
            parameters:
                - name: state_codes
                  in: query
                  description: Two-letter uppercase US state codes, such as TX or CA.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "example"
                  schema:
                    type: array
                    items:
                        type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "alerts":
                                    - "areaDesc": "example"
                                      "event": "example"
                                      "expires": 1
                                      "headline": "example"
                                      "id": "example-id"
                                "degraded": true
                            schema:
                                $ref: '#/components/schemas/ListWeatherAlertsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/marketing/v1/list-calendar-events:
        get:
            tags:
                - MarketingService
            summary: ListCalendarEvents
            description: ListCalendarEvents returns holidays and observances in a date window.
            operationId: ListCalendarEvents
            parameters:
                - name: from_date
                  in: query
                  description: First date of the window, inclusive, as YYYY-MM-DD.
                  required: true
                  example: "2026-01-15"
                  schema:
                    type: string
                    pattern: '^\d{4}-\d{2}-\d{2}$'
                - name: to_date
                  in: query
                  description: Last date of the window, inclusive, as YYYY-MM-DD.
                  required: true
                  example: "2026-01-15"
                  schema:
                    type: string
                    pattern: '^\d{4}-\d{2}-\d{2}$'
                - name: categories
                  in: query
                  description: Marketing category ids to include; an empty list means all categories.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "example"
                  schema:
                    type: array
                    items:
                        type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "degraded": true
                                "events":
                                    - "categories":
                                        - "example"
                                      "date": "2026-01-15"
                                      "id": "example-id"
                                      "kind": "example"
                                      "name": "WorldMonitor Analyst"
                            schema:
                                $ref: '#/components/schemas/ListCalendarEventsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/marketing/v1/search-local-mentions:
        post:
            parameters:
                - name: Idempotency-Key
                  in: header
                  description: Optional client-generated idempotency key. Retrying a POST with the same key and an identical request body replays the original response (only the status, body, and Content-Type are reproduced) instead of re-executing; reusing the key with a different body is rejected with 422. For mutations this avoids duplicating the side effect, while for batch-read POSTs it replays a cached snapshot that can be up to 24 hours stale. Keys are scoped per authenticated caller (falling back to the source IP for unauthenticated endpoints) and retained for 24 hours.
                  required: false
                  example: "4f8b9c2e-1a3d-4b6f-8e0a-2c5d7f9b1e34"
                  schema:
                    type: string
                    minLength: 1
                    maxLength: 255
                    pattern: "^[\\x21-\\x7E]{1,255}$"
            tags:
                - MarketingService
            summary: SearchLocalMentions
            description: SearchLocalMentions finds local news mentions for client terms; POST so terms never reach URLs or CDN keys.
            operationId: SearchLocalMentions
            requestBody:
                content:
                    application/json:
                        example:
                            "queries":
                                - "city": "example"
                                  "clientId": "example-id"
                                  "stateCode": "example"
                                  "terms":
                                      - "example"
                        schema:
                            $ref: '#/components/schemas/SearchLocalMentionsRequest'
                required: true
            responses:
                "200":
                    description: Successful response
                    headers:
                        Idempotency-Key:
                            schema:
                                type: string
                            description: The idempotency key echoed from the request. Present only when the client opted into idempotency.
                        Idempotent-Replayed:
                            schema:
                                type: boolean
                            description: true when this response was replayed from an earlier request with the same key, false on the first (original) request. Present only when the client opted into idempotency.
                    content:
                        application/json:
                            example:
                                "degraded": true
                                "mentions":
                                    - "clientId": "example-id"
                                      "id": "example-id"
                                      "lat": 40.7128
                                      "lon": -74.006
                                      "publishedAt": 1717200000000
                            schema:
                                $ref: '#/components/schemas/SearchLocalMentionsResponse'
                "400":
                    description: Validation error, invalid Idempotency-Key header, or malformed JSON request body
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - type: object
                                      required:
                                        - error
                                        - message
                                      properties:
                                        error:
                                            type: string
                                        message:
                                            type: string
                                    - $ref: '#/components/schemas/InvalidRequestBodyError'
                "409":
                    description: A request with this Idempotency-Key is still being processed
                    headers:
                        Idempotency-Key:
                            schema:
                                type: string
                            description: The idempotency key supplied by the client.
                        Retry-After:
                            schema:
                                type: string
                            description: Seconds to wait before retrying the in-flight request.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                    - message
                                properties:
                                    error:
                                        type: string
                                    message:
                                        type: string
                "422":
                    description: The Idempotency-Key was already used with a different request body
                    headers:
                        Idempotency-Key:
                            schema:
                                type: string
                            description: The idempotency key supplied by the client.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - error
                                    - message
                                properties:
                                    error:
                                        type: string
                                    message:
                                        type: string
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
    /api/marketing/v1/get-demand-trends:
        get:
            tags:
                - MarketingService
            summary: GetDemandTrends
            description: GetDemandTrends returns category demand series and trending search terms.
            operationId: GetDemandTrends
            parameters:
                - name: categories
                  in: query
                  description: Marketing category ids to include; an empty list means all categories.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "example"
                  schema:
                    type: array
                    items:
                        type: string
                - name: state_codes
                  in: query
                  description: Two-letter US state codes to localize trends to.
                  required: false
                  style: form
                  explode: true
                  example:
                      - "example"
                  schema:
                    type: array
                    items:
                        type: string
                - name: jmespath
                  in: query
                  description: |-
                    Optional JMESPath expression applied server-side to project or reduce the JSON response before it is returned (mirrors the MCP jmespath argument). Invalid expressions, expressions larger than 1024 UTF-8 bytes, or projections that exceed the 256 KB output cap return HTTP 400 with a {_jmespath_error, original_keys} envelope. Grammar and worked examples: https://www.worldmonitor.app/docs/mcp-jmespath.
                  required: false
                  example: "keys(@)"
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            example:
                                "degraded": true
                                "trendingNow":
                                    - "geo": "example"
                                      "term": "example"
                                      "traffic": "example"
                                "trends":
                                    - "category": "cs.AI"
                                      "points":
                                          - "date": 1717200000000
                                            "value": 1.5
                            schema:
                                $ref: '#/components/schemas/GetDemandTrendsResponse'
                "400":
                    description: Validation error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ValidationError'
                                    - $ref: '#/components/schemas/JmespathProjectionError'
                "401":
                    description: Missing or invalid API key.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnauthorizedError'
                "403":
                    description: API access requires an active subscription (the API key's subscription is inactive or expired).
                    headers:
                        X-Billing-Verification:
                            description: Present when the 403 is a billing-provider-confirmed subscription lapse (value subscription_lapsed, matching the body `code`).
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ForbiddenError'
                "429":
                    description: Rate limit exceeded.
                    headers:
                        X-RateLimit-Limit:
                            description: Maximum requests allowed in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Remaining:
                            description: Requests remaining in the active rate-limit window.
                            schema:
                                type: string
                        X-RateLimit-Reset:
                            description: Unix epoch milliseconds when the active rate-limit window resets.
                            schema:
                                type: string
                        Retry-After:
                            description: Seconds to wait before retrying the request.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/RateLimitError'
                "503":
                    description: Service unavailable. Billing-verification responses include code and X-Billing-Verification; other gateway infrastructure failures use the generic GatewayError shape.
                    headers:
                        Retry-After:
                            description: Seconds to wait before retrying (1-60).
                            schema:
                                type: string
                        X-Billing-Verification:
                            description: Billing-verification state that produced this response (matches the body `code`).
                            schema:
                                type: string
                        X-Validation-Mode:
                            description: Present with value degraded when user API-key validation is temporarily unavailable.
                            schema:
                                type: string
                        X-RateLimit-Mode:
                            description: Present with value degraded when a fail-closed rate-limit dependency is unavailable.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/BillingVerificationError'
                                    - $ref: '#/components/schemas/GatewayError'
                default:
                    description: Gateway or handler error response.
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Error'
                                    - $ref: '#/components/schemas/GatewayError'
components:
    securitySchemes:
        WorldMonitorKey:
            type: apiKey
            in: header
            name: X-WorldMonitor-Key
            description: User-issued WorldMonitor API key.
        ApiKeyHeader:
            type: apiKey
            in: header
            name: X-Api-Key
            description: Alias header for the WorldMonitor API key (X-WorldMonitor-Key).
    schemas:
        JmespathProjectionError:
            description: Returned when a REST jmespath projection is invalid or exceeds the expression/output byte limits.
            properties:
                _jmespath_error:
                    description: Projection error discriminator and details.
                    type: string
                original_keys:
                    description: Top-level keys or shape of the unprojected response.
                    items:
                        type: string
                    type: array
            required:
                - _jmespath_error
                - original_keys
            type: object
        UnauthorizedError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable error message.
            required:
                - error
            description: Returned when the API key is missing, malformed, or lacks current API access.
        Error:
            type: object
            properties:
                message:
                    type: string
                    description: Error message (e.g., 'user not found', 'database connection failed')
            description: Error is returned when a handler encounters an error. It contains a simple error message that the developer can customize.
        BillingVerificationError:
            type: object
            description: "Returned with HTTP 503 when paid access cannot be confirmed right now: the billing provider is re-verifying a recently expired subscription, or the entitlement backend is unreachable. Retryable — honor Retry-After."
            properties:
                error:
                    type: string
                    description: Human-readable billing-verification failure reason.
                code:
                    type: string
                    enum:
                        - renewal_verification_pending
                        - renewal_verification_failed
                        - entitlement_verification_unavailable
                    description: Machine-readable billing-verification state, mirrored in the X-Billing-Verification response header.
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint, when the denial came from a tier gate.
            required:
                - error
                - code
        InvalidRequestBodyError:
            type: object
            description: Returned when a JSON POST request body is empty or malformed.
            properties:
                message:
                    type: string
                    description: Invalid request body
            required:
                - message
        GatewayError:
            type: object
            description: Returned by gateway infrastructure errors before an RPC handler runs, such as origin, routing, method, authentication, or quota checks.
            properties:
                error:
                    oneOf:
                        - type: string
                        - type: object
                          additionalProperties: true
                    description: Gateway error reason or structured gateway failure details.
            required:
                - error
        RateLimitError:
            type: object
            description: Returned when a gateway or handler rate limit rejects the request.
            properties:
                error:
                    type: string
                    description: Human-readable rate-limit failure reason.
            required:
                - error
        ForbiddenError:
            type: object
            properties:
                error:
                    type: string
                    description: Human-readable entitlement failure reason.
                code:
                    type: string
                    enum:
                        - subscription_lapsed
                    description: Machine-readable denial code, present when the 403 is a billing-provider-confirmed subscription lapse (mirrored in the X-Billing-Verification response header).
                requiredTier:
                    type: integer
                    format: int32
                    description: Minimum entitlement tier required for this endpoint.
                currentTier:
                    type: integer
                    format: int32
                    description: Caller entitlement tier when known.
                planKey:
                    type: string
                    description: Caller plan key when known.
            required:
                - error
            description: Returned when a PRO-gated endpoint denies access because the caller has no resolved authenticated user, entitlements cannot be verified, or the caller lacks the required entitlement tier.
        FieldViolation:
            type: object
            properties:
                field:
                    type: string
                    description: The field path that failed validation (e.g., 'user.email' for nested fields). For header validation, this will be the header name (e.g., 'X-API-Key')
                description:
                    type: string
                    description: Human-readable description of the validation violation (e.g., 'must be a valid email address', 'required field missing')
            required:
                - field
                - description
            description: FieldViolation describes a single validation error for a specific field.
        ValidationError:
            type: object
            properties:
                violations:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldViolation'
                    description: List of validation violations
            required:
                - violations
            description: ValidationError is returned when request validation fails. It contains a list of field violations describing what went wrong.
        ListWeatherAlertsRequest:
            type: object
            properties:
                stateCodes:
                    type: array
                    items:
                        type: string
                        maxItems: 60
                        description: Two-letter uppercase US state codes, such as TX or CA.
                    maxItems: 60
            description: ListWeatherAlertsRequest selects the US states to read active alerts for.
        ListWeatherAlertsResponse:
            type: object
            properties:
                alerts:
                    type: array
                    items:
                        $ref: '#/components/schemas/WeatherAlert'
                degraded:
                    type: boolean
                    description: True when an upstream source failed and the list may be incomplete.
            description: ListWeatherAlertsResponse carries the active alerts for the requested states.
        WeatherAlert:
            type: object
            properties:
                id:
                    type: string
                    description: Upstream NWS alert identifier.
                event:
                    type: string
                    description: NWS event name, such as "Winter Storm Warning".
                severity:
                    type: string
                    description: 'Mapped severity bucket: info, watch or warning.'
                headline:
                    type: string
                    description: Short NWS headline for the alert.
                areaDesc:
                    type: string
                    description: Human-readable area description from NWS.
                onset:
                    type: integer
                    format: int64
                    description: 'Alert onset time, Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                expires:
                    type: integer
                    format: int64
                    description: 'Alert expiry time, Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                polygonGeojson:
                    type: string
                    description: Alert shape as a GeoJSON geometry string; empty when no shape is known.
                zoneCodes:
                    type: array
                    items:
                        type: string
                        description: NWS zone codes the alert covers.
                stateCodes:
                    type: array
                    items:
                        type: string
                        description: Two-letter US state codes the alert covers.
            description: WeatherAlert is one active NWS alert that touches a client service area.
        ListCalendarEventsRequest:
            type: object
            properties:
                fromDate:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: First date of the window, inclusive, as YYYY-MM-DD.
                toDate:
                    type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                    description: Last date of the window, inclusive, as YYYY-MM-DD.
                categories:
                    type: array
                    items:
                        type: string
                        maxItems: 15
                        description: Marketing category ids to include; an empty list means all categories.
                    maxItems: 15
            required:
                - fromDate
                - toDate
            description: ListCalendarEventsRequest selects a date window and marketing categories.
        ListCalendarEventsResponse:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/CalendarEvent'
                degraded:
                    type: boolean
                    description: True when an upstream source failed and the list may be incomplete.
            description: ListCalendarEventsResponse carries the events inside the requested window.
        CalendarEvent:
            type: object
            properties:
                id:
                    type: string
                    description: Stable event identifier.
                date:
                    type: string
                    description: Calendar date as YYYY-MM-DD; a date, not a timestamp.
                name:
                    type: string
                    description: Display name of the event.
                kind:
                    type: string
                    description: 'Event kind: holiday or observance.'
                categories:
                    type: array
                    items:
                        type: string
                        description: Marketing category ids the event is relevant to.
            description: CalendarEvent is one holiday or observance relevant to marketing planning.
        SearchLocalMentionsRequest:
            type: object
            properties:
                queries:
                    type: array
                    items:
                        $ref: '#/components/schemas/MentionQuery'
                    maxItems: 20
            description: SearchLocalMentionsRequest carries per-client search queries in the POST body.
        MentionQuery:
            type: object
            properties:
                clientId:
                    type: string
                    description: Roster client id the results belong to.
                terms:
                    type: array
                    items:
                        type: string
                        maxItems: 10
                        description: Search terms for this client, such as its business name.
                    maxItems: 10
                city:
                    type: string
                    description: City used to localize the search.
                stateCode:
                    type: string
                    description: Two-letter US state code used to localize the search.
            required:
                - clientId
            description: MentionQuery is one client's search terms and location.
        SearchLocalMentionsResponse:
            type: object
            properties:
                mentions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Mention'
                degraded:
                    type: boolean
                    description: True when an upstream source failed and the list may be incomplete.
            description: SearchLocalMentionsResponse carries the mentions found for the queries.
        Mention:
            type: object
            properties:
                id:
                    type: string
                    description: Stable mention identifier.
                clientId:
                    type: string
                    description: Roster client id the mention matched.
                title:
                    type: string
                    description: Article headline.
                source:
                    type: string
                    description: Publisher or feed name.
                url:
                    type: string
                    description: Article URL.
                publishedAt:
                    type: integer
                    format: int64
                    description: 'Publication time, Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                lat:
                    type: number
                    format: double
                    description: Latitude of the mention; 0,0 means no location and the browser uses the client location.
                lon:
                    type: number
                    format: double
                    description: Longitude of the mention; 0,0 means no location and the browser uses the client location.
            description: Mention is one news article that matched a client's terms.
        GetDemandTrendsRequest:
            type: object
            properties:
                categories:
                    type: array
                    items:
                        type: string
                        description: Marketing category ids to include; an empty list means all categories.
                stateCodes:
                    type: array
                    items:
                        type: string
                        description: Two-letter US state codes to localize trends to.
            description: GetDemandTrendsRequest selects marketing categories and US states.
        GetDemandTrendsResponse:
            type: object
            properties:
                trends:
                    type: array
                    items:
                        $ref: '#/components/schemas/DemandTrend'
                trendingNow:
                    type: array
                    items:
                        $ref: '#/components/schemas/TrendingTerm'
                degraded:
                    type: boolean
                    description: True when an upstream source failed and the lists may be incomplete.
            description: GetDemandTrendsResponse carries category demand series and trending terms.
        DemandTrend:
            type: object
            properties:
                category:
                    type: string
                    description: Marketing category id.
                points:
                    type: array
                    items:
                        $ref: '#/components/schemas/TrendPoint'
            description: DemandTrend is a demand series for one marketing category.
        TrendPoint:
            type: object
            properties:
                date:
                    type: integer
                    format: int64
                    description: 'Sample date, Unix epoch milliseconds.. Warning: Values > 2^53 may lose precision in JavaScript'
                value:
                    type: number
                    format: double
                    description: Relative demand value for the sample.
            description: TrendPoint is one sample of a demand series.
        TrendingTerm:
            type: object
            properties:
                term:
                    type: string
                    description: Trending search term.
                geo:
                    type: string
                    description: Geography the term is trending in, such as US or US-TX.
                traffic:
                    type: string
                    description: Approximate traffic label from the source, such as "50K+".
            description: TrendingTerm is one currently trending search term.
